<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>騎乘分析 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css?v=2.0.8">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>騎乘分析 2.0</h1>
      <p class="sub">匯入碼錶的 FIT 或 Strava 的 GPX。勾一趟看路線與分段，勾兩趟跑同路線對騎。檔案在瀏覽器內分析。</p>
    </div>
    <button class="btn" id="printBtn" hidden>列印／存成 PDF</button>
  </header>

  <section class="card picker" id="picker">
    <div class="drop" id="drop">
      <input type="file" id="fileInput" accept=".fit,.gpx,application/gpx+xml" multiple hidden>
      <button class="btn primary" id="pickBtn">選擇 FIT／GPX（可多選）</button>
      <button class="btn" id="historyBtn" aria-controls="history" aria-expanded="false">從歷史紀錄選擇</button>
      <span>或把檔案拖到這裡</span>
    </div>
    <section class="history" id="history" aria-label="歷史騎乘" hidden>
      <p class="note" id="historyStatus" role="status"></p>
      <fieldset id="historyChoices" hidden>
        <legend>選擇歷史騎乘（可多選）</legend>
        <div class="history-options" id="historyOptions"></div>
      </fieldset>
      <button class="btn primary" id="historyImport" hidden disabled>匯入所選騎乘</button>
      <button class="btn" id="historyRetry" hidden>重試載入</button>
    </section>
    <div class="tablewrap" id="listWrap" hidden>
      <table class="list" id="list">
        <thead><tr><th></th><th>日期</th><th>名稱</th><th class="n">距離</th><th class="n">時間</th><th class="n">均速</th><th class="n">爬升</th><th>檔名</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions" id="actions" hidden>
      <span id="selHint">勾一趟＝單趟分析，勾兩趟＝比較</span>
      <button class="btn primary" id="goBtn" disabled>分析</button>
    </div>
    <p class="err" id="err" hidden></p>
    <p class="note" id="importNote" role="status" hidden></p>
  </section>

  <main id="report"></main>

  <footer class="foot">
    底圖 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors｜地形暈渲 © 內政部國土測繪中心｜
    <a href="https://github.com/evantilu/bike-visualization-and-analyses">原始碼</a>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js?v=2.0.8"></script>
</body>
</html>
