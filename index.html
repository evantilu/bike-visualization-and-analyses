<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>騎乘分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>騎乘分析</h1>
      <p class="sub">丟進 Strava 匯出的 GPX。勾一趟看單趟分析，勾兩趟看比較與虛擬對騎。檔案只在你的瀏覽器裡計算，不會上傳。</p>
    </div>
    <button class="btn" id="printBtn" hidden>列印／存成 PDF</button>
  </header>

  <section class="card picker" id="picker">
    <div class="drop" id="drop">
      <input type="file" id="fileInput" accept=".gpx,application/gpx+xml" multiple hidden>
      <button class="btn primary" id="pickBtn">選擇 GPX 檔案（可多選）</button>
      <span>或把檔案拖到這裡</span>
    </div>
    <div class="tablewrap" id="listWrap" hidden>
      <table class="list" id="list">
        <thead><tr><th></th><th>日期</th><th>名稱</th><th class="n">距離</th><th class="n">移動時間</th><th class="n">均速</th><th class="n">爬升</th><th>檔名</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions" id="actions" hidden>
      <span id="selHint">勾一趟＝單趟分析，勾兩趟＝比較</span>
      <button class="btn primary" id="goBtn" disabled>分析</button>
    </div>
    <p class="err" id="err" hidden></p>
  </section>

  <main id="report"></main>

  <footer class="foot">
    底圖 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors｜地形暈渲 © 內政部國土測繪中心｜
    <a href="https://github.com/evantilu/bike-visualization-and-analyses">原始碼</a>
  </footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
